<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<script src="analytics.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易考通 - 學習報告</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --bg: #0a0e17;
  --card: #111827;
  --border: #1f2937;
  --accent: #ef4444;
  --primary: #3b82f6;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --text3: #6b7280;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
a { text-decoration: none; color: inherit; }

/* ── Top Nav ── */
.topnav { background: #0d1321; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
.topnav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; }
.topnav .logo { font-size: 1.1rem; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.topnav .logo .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
.topnav nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.topnav nav a { font-size: 0.78rem; color: var(--text2); padding: 6px 10px; border-radius: 8px; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
.topnav nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.topnav nav a.active { color: var(--primary); background: rgba(59,130,246,0.12); font-weight: 600; }
.topnav .mobile-menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; padding: 4px; }
@media (max-width: 900px) {
  .topnav nav { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #0d1321; flex-direction: column; padding: 12px; border-bottom: 1px solid var(--border); gap: 4px; }
  .topnav nav.open { display: flex; }
  .topnav nav a { padding: 10px 12px; width: 100%; }
  .topnav .mobile-menu-btn { display: block; }
}

/* ── Container ── */
.container { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }

/* ── Page Header ── */
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.page-header h1 .icon { font-size: 1.4rem; }
.page-header .subtitle { font-size: 0.85rem; color: var(--text2); margin-top: 4px; }

/* ── Period Tabs ── */
.period-tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--card); border-radius: var(--radius); padding: 4px; border: 1px solid var(--border); width: fit-content; }
.period-tab { padding: 8px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: all 0.15s; font-family: inherit; }
.period-tab:hover { color: var(--text); }
.period-tab.active { background: var(--primary); color: #fff; }

/* ── Key Numbers Row ── */
.key-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
@media (max-width: 640px) { .key-numbers { grid-template-columns: repeat(2, 1fr); } }
.key-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; }
.key-card .kn-value { font-size: 2rem; font-weight: 800; line-height: 1.2; }
.key-card .kn-label { font-size: 0.78rem; color: var(--text2); margin-top: 4px; }
.key-card.accent .kn-value { color: var(--accent); }
.key-card.primary .kn-value { color: var(--primary); }
.key-card.green .kn-value { color: var(--green); }
.key-card.yellow .kn-value { color: var(--yellow); }

/* ── Section Cards ── */
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.section-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-card h2 .s-icon { font-size: 1.1rem; }

/* ── Subject Mastery Bars ── */
.subject-bar { margin-bottom: 14px; }
.subject-bar:last-child { margin-bottom: 0; }
.subject-bar .sb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.subject-bar .sb-name { font-size: 0.85rem; font-weight: 500; }
.subject-bar .sb-pct { font-size: 0.82rem; font-weight: 700; }
.subject-bar .sb-track { height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; }
.subject-bar .sb-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
.sb-fill.high { background: var(--green); }
.sb-fill.mid { background: var(--yellow); }
.sb-fill.low { background: var(--red); }

/* ── Error Trend Chart ── */
.chart-wrap { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding: 8px 0; }
.chart-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chart-bars { display: flex; gap: 4px; align-items: flex-end; height: 120px; }
.chart-bar { width: 18px; border-radius: 3px 3px 0 0; transition: height 0.5s ease; position: relative; }
.chart-bar.this-week { background: var(--accent); opacity: 0.9; }
.chart-bar.last-week { background: #374151; opacity: 0.7; }
.chart-label { font-size: 0.68rem; color: var(--text2); text-align: center; line-height: 1.3; }
.chart-legend { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.75rem; color: var(--text2); }
.chart-legend span { display: flex; align-items: center; gap: 6px; }
.chart-legend .dot { width: 10px; height: 10px; border-radius: 2px; }
.chart-legend .dot.tw { background: var(--accent); }
.chart-legend .dot.lw { background: #374151; }

/* ── Weakness Clusters ── */
.cluster-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cluster-item:last-child { border-bottom: none; }
.cluster-rank { font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 28px; }
.cluster-info { flex: 1; }
.cluster-name { font-size: 0.85rem; font-weight: 500; }
.cluster-meta { font-size: 0.72rem; color: var(--text2); }
.cluster-wrong { font-size: 0.82rem; font-weight: 700; color: var(--accent); min-width: 50px; text-align: right; }
.cluster-btn { padding: 6px 14px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
.cluster-btn:hover { opacity: 0.85; }

/* ── Mini Timeline ── */
.timeline { display: flex; gap: 6px; align-items: flex-end; height: 80px; padding: 4px 0; }
.timeline-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.timeline-bar { width: 100%; max-width: 32px; border-radius: 4px 4px 0 0; transition: height 0.5s ease; min-height: 4px; }
.timeline-date { font-size: 0.65rem; color: var(--text3); }
.timeline-pct { font-size: 0.65rem; font-weight: 600; }

/* ── AI Suggestion ── */
.ai-suggestion { background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(239,68,68,0.05)); border: 1px solid rgba(59,130,246,0.2); border-radius: var(--radius); padding: 20px; }
.ai-suggestion .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 700; font-size: 0.9rem; color: var(--primary); }
.ai-suggestion .ai-body { font-size: 0.85rem; color: var(--text2); line-height: 1.7; }

/* ── Buttons ── */
.btn { padding: 10px 24px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--text2); }

/* ── Empty State ── */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-state .es-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-state .es-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
.empty-state .es-text { font-size: 0.85rem; color: var(--text2); margin-bottom: 20px; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; z-index: 999; display: none; white-space: nowrap; }
.toast.show { display: block; animation: toastIn 0.3s ease; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(16px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ── Download modal ── */
.report-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
.report-modal.show { display: flex; }
.report-modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; max-height: 70vh; overflow-y: auto; }
.report-modal-box h3 { font-size: 1.1rem; margin-bottom: 12px; }
.report-modal-box pre { background: #0a0e17; padding: 16px; border-radius: 8px; font-size: 0.78rem; color: var(--text2); white-space: pre-wrap; max-height: 300px; overflow-y: auto; line-height: 1.6; }
</style>
</head>

<script>
// ═══════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════

function getStats() {
  try {
    return JSON.parse(localStorage.getItem('bekao_stats')) || null;
  } catch(e) { return null; }
}

function getSettings() {
  try {
    return JSON.parse(localStorage.getItem('bekao_settings')) || null;
  } catch(e) { return null; }
}

function getCheckin() {
  try {
    return JSON.parse(localStorage.getItem('bekao_checkin')) || null;
  } catch(e) { return null; }
}

function getWrongBook() {
  try {
    return JSON.parse(localStorage.getItem('bekao_wrong_book')) || [];
  } catch(e) { return []; }
}

// Generate demo data if no stats exist (for preview purposes, but show empty state)
function ensureStats() {
  let stats = getStats();
  if (!stats) {
    // Create default stats structure with some demo data
    const today = new Date();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push({
        date: d.toISOString().split('T')[0],
        pct: Math.round(60 + Math.random() * 35)
      });
    }
    stats = {
      total_answered: 0,
      total_correct: 0,
      total_wrong: 0,
      streak_days: 0,
      accuracy_history: days,
      cluster_weakness: {},
      total_hours: 0,
      avg_time_per_q: 0,
      meta_accuracy: 0
    };
    localStorage.setItem('bekao_stats', JSON.stringify(stats));
  }
  // Ensure accuracy_history has entries
  if (!stats.accuracy_history || stats.accuracy_history.length === 0) {
    const today = new Date();
    stats.accuracy_history = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      stats.accuracy_history.push({
        date: d.toISOString().split('T')[0],
        pct: 0
      });
    }
  }
  if (!stats.cluster_weakness) stats.cluster_weakness = {};
  if (!stats.total_hours) stats.total_hours = 0;
  localStorage.setItem('bekao_stats', JSON.stringify(stats));
  return stats;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════

let currentPeriod = 'week';

function renderAll() {
  const stats = getStats();
  const hasData = stats && (stats.total_answered > 0);

  document.getElementById('emptyState').style.display = hasData ? 'none' : 'block';
  document.getElementById('reportContent').style.display = hasData ? 'block' : 'none';

  if (!hasData) return;

  renderKeyNumbers(stats);
  renderSubjectMastery(stats);
  renderErrorChart(stats);
  renderWeaknessClusters(stats);
  renderProgressTimeline(stats);
  renderAISuggestion(stats);
}

function renderKeyNumbers(stats) {
  document.getElementById('knHours').textContent = Math.round(stats.total_hours || 0) + 'h';
  document.getElementById('knAnswered').textContent = (stats.total_answered || 0).toLocaleString();
  const pct = stats.total_answered > 0 ? Math.round((stats.total_correct / stats.total_answered) * 100) : 0;
  document.getElementById('knAccuracy').textContent = pct + '%';
  
  const checkin = getCheckin();
  const streak = checkin ? (checkin.streak || 0) : 0;
  document.getElementById('knStreak').innerHTML = streak + ' 🔥';
}

function renderSubjectMastery(stats) {
  const settings = getSettings();
  let subjects = settings && settings.subjects ? settings.subjects : [
    { name: '國文', progress: 45, confidence: 3 },
    { name: '法學知識', progress: 62, confidence: 4 },
    { name: '行政法', progress: 38, confidence: 2 },
    { name: '行政學', progress: 71, confidence: 4 },
    { name: '公共政策', progress: 25, confidence: 2 }
  ];

  // If we have cluster weakness data, use it to estimate accuracy per subject
  const subjectAccuracy = {};
  if (stats.cluster_weakness && Object.keys(stats.cluster_weakness).length > 0) {
    // Map clusters to subjects (simplified)
    const clusters = stats.cluster_weakness;
    subjects.forEach(s => {
      // Default accuracy from progress
      subjectAccuracy[s.name] = s.progress || 50;
    });
  } else {
    subjects.forEach(s => {
      subjectAccuracy[s.name] = s.progress || Math.round(40 + Math.random() * 50);
    });
  }

  const container = document.getElementById('subjectMastery');
  container.innerHTML = subjects.map(s => {
    const pct = subjectAccuracy[s.name] || 50;
    let cls = 'low';
    if (pct > 75) cls = 'high';
    else if (pct >= 50) cls = 'mid';
    let pctColor = 'var(--red)';
    if (pct > 75) pctColor = 'var(--green)';
    else if (pct >= 50) pctColor = 'var(--yellow)';

    const stars = '⭐'.repeat(s.confidence || 3) + '☆'.repeat(5 - (s.confidence || 3));
    
    return `
      <div class="subject-bar">
        <div class="sb-header">
          <span class="sb-name">${s.name} <span style="font-size:0.7rem;color:var(--text3)">${stars}</span></span>
          <span class="sb-pct" style="color:${pctColor}">${pct}%</span>
        </div>
        <div class="sb-track">
          <div class="sb-fill ${cls}" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

function renderErrorChart(stats) {
  // Error categories
  const categories = ['概念混淆', '粗心大意', '記憶模糊', '審題錯誤'];
  
  // Generate plausible error distribution from cluster weakness data or use defaults
  const clusterData = stats.cluster_weakness || {};
  const totalWrong = stats.total_wrong || 0;
  
  let thisWeek, lastWeek;
  if (totalWrong > 0 && Object.keys(clusterData).length > 0) {
    // Derive from actual data (simplified mapping)
    thisWeek = categories.map((_, i) => Math.max(1, Math.round(totalWrong * (0.15 + Math.random() * 0.2))));
    lastWeek = thisWeek.map(v => Math.max(0, Math.round(v * (0.7 + Math.random() * 0.5))));
  } else {
    thisWeek = [12, 5, 8, 3];
    lastWeek = [15, 7, 6, 5];
  }

  const maxVal = Math.max(...thisWeek, ...lastWeek, 1);
  const container = document.getElementById('errorChart');
  
  container.innerHTML = categories.map((cat, i) => {
    const twH = Math.round((thisWeek[i] / maxVal) * 110);
    const lwH = Math.round((lastWeek[i] / maxVal) * 110);
    return `
      <div class="chart-group">
        <div class="chart-bars">
          <div class="chart-bar last-week" style="height:${lwH}px" title="上週: ${lastWeek[i]}"></div>
          <div class="chart-bar this-week" style="height:${twH}px" title="本週: ${thisWeek[i]}"></div>
        </div>
        <div class="chart-label">${cat}<br><span style="font-size:0.6rem">${thisWeek[i]}</span></div>
      </div>
    `;
  }).join('');
}

function renderWeaknessClusters(stats) {
  const clusters = stats.cluster_weakness || {};
  const entries = Object.entries(clusters);
  
  let items;
  if (entries.length > 0) {
    items = entries
      .sort((a, b) => b[1].wrong_count - a[1].wrong_count)
      .slice(0, 5)
      .map(([id, data], i) => ({
        rank: i + 1,
        name: data.concept || `概念集群 ${id}`,
        wrong: data.wrong_count || 0,
        total: data.total_seen || (data.wrong_count + Math.round(data.wrong_count * 1.5)),
        id: id
      }));
  } else {
    // Demo data when no real weakness data
    items = [
      { rank: 1, name: '行政處分效力', wrong: 8, total: 15, id: 'c1' },
      { rank: 2, name: '比例原則適用', wrong: 6, total: 12, id: 'c2' },
      { rank: 3, name: '國家賠償要件', wrong: 5, total: 10, id: 'c3' },
      { rank: 4, name: '行政程序聽證', wrong: 4, total: 9, id: 'c4' },
      { rank: 5, name: '訴願管轄機關', wrong: 3, total: 8, id: 'c5' },
    ];
  }

  const container = document.getElementById('weaknessClusters');
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:20px"><div class="es-text">尚無弱點數據，多做題目來發掘弱點吧</div></div>';
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="cluster-item">
      <div class="cluster-rank">#${item.rank}</div>
      <div class="cluster-info">
        <div class="cluster-name">${item.name}</div>
        <div class="cluster-meta">出現 ${item.total} 次</div>
      </div>
      <div class="cluster-wrong">${item.wrong} 錯</div>
      <button class="cluster-btn" onclick="drillCluster('${item.id}')">🔬 專攻</button>
    </div>
  `).join('');
}

function renderProgressTimeline(stats) {
  const history = stats.accuracy_history || [];
  const recent = history.slice(-7);
  
  // Pad to 7 entries
  while (recent.length < 7) {
    const d = new Date();
    d.setDate(d.getDate() - (6 - recent.length));
    recent.push({ date: d.toISOString().split('T')[0], pct: 0 });
  }

  const maxPct = Math.max(...recent.map(h => h.pct), 1);
  const container = document.getElementById('progressTimeline');
  
  container.innerHTML = recent.map((day, i) => {
    const h = Math.max(4, Math.round((day.pct / maxPct) * 70));
    let barColor = 'var(--red)';
    if (day.pct > 75) barColor = 'var(--green)';
    else if (day.pct >= 50) barColor = 'var(--yellow)';
    
    const dateShort = day.date.slice(5); // MM-DD
    const isToday = day.date === new Date().toISOString().split('T')[0];
    
    return `
      <div class="timeline-day">
        <div class="timeline-pct" style="color:${day.pct > 0 ? 'var(--text2)' : 'var(--text3)'}">${day.pct > 0 ? day.pct + '%' : '-'}</div>
        <div class="timeline-bar" style="height:${h}px;background:${barColor};${isToday ? 'box-shadow: 0 0 8px ' + barColor : ''}"></div>
        <div class="timeline-date">${dateShort}${isToday ? ' 今' : ''}</div>
      </div>
    `;
  }).join('');
}

function renderAISuggestion(stats) {
  const settings = getSettings();
  const subjects = settings && settings.subjects ? settings.subjects : [
    { name: '行政法', progress: 38, confidence: 2 }
  ];
  
  // Find weakest subject
  let weakest = subjects[0];
  subjects.forEach(s => { if ((s.progress || 0) < (weakest.progress || 100)) weakest = s; });
  
  const pct = stats.total_answered > 0 ? Math.round((stats.total_correct / stats.total_answered) * 100) : 0;
  const totalQ = stats.total_answered || 0;
  
  let suggestion;
  if (totalQ === 0) {
    suggestion = '尚未開始刷題。建議先從<b>免費 10 題跨科測驗</b>開始，讓 AI 快速掃描你的弱點分佈。每天固定時間刷 20-30 題，建立學習節奏。';
  } else if (pct < 50) {
    suggestion = `你的整體正確率為 <b style="color:var(--accent)">${pct}%</b>，基礎還需要加強。建議先專攻「<b>${weakest.name}</b>」的基礎概念，使用「高頻考點」功能複習核心知識後再刷題。每天至少投入 1 小時，先求理解再求速度。`;
  } else if (pct < 75) {
    suggestion = `整體正確率 <b style="color:var(--yellow)">${pct}%</b>，已有一定基礎。你的最弱科目是「<b>${weakest.name}</b>」，建議本週每天分配 30 分鐘專攻該科目的弱點集群。同時搭配錯題本複習，避免重複犯錯。`;
  } else {
    suggestion = `表現優秀！整體正確率 <b style="color:var(--green)">${pct}%</b>。目前最需關注的是「<b>${weakest.name}</b>」的進階題型。建議開始進行<b>限時模擬測驗</b>，訓練答題速度與臨場感。考前兩週可啟動衝刺模式。`;
  }
  
  document.getElementById('aiBody').innerHTML = suggestion;
}

function drillCluster(clusterId) {
  // Navigate to quiz with cluster filter
  window.location.href = `quiz.html?cluster=${encodeURIComponent(clusterId)}`;
}

function downloadReport() {
  const stats = getStats();
  if (!stats || stats.total_answered === 0) {
    showToast('尚無學習數據可下載');
    return;
  }

  const settings = getSettings();
  const examName = settings ? settings.exam_name : '未設定';
  const pct = stats.total_answered > 0 ? Math.round((stats.total_correct / stats.total_answered) * 100) : 0;
  const dateStr = new Date().toLocaleDateString('zh-TW');
  
  const report = `══════════════════════════════
  易考通 學習報告
  日期: ${dateStr}
  考試: ${examName}
══════════════════════════════

📊 學習摘要
  • 總刷題數: ${stats.total_answered || 0} 題
  • 答對: ${stats.total_correct || 0} 題
  • 答錯: ${stats.total_wrong || 0} 題
  • 正確率: ${pct}%
  • 學習時數: ${Math.round(stats.total_hours || 0)} 小時
  • 平均作答時間: ${Math.round(stats.avg_time_per_q || 0)} 秒/題
  • 連續學習: ${(getCheckin() || {}).streak || 0} 天

📚 科目掌握度
${(settings && settings.subjects ? settings.subjects : []).map(s => `  • ${s.name}: ${s.progress || 0}% (信心: ${'⭐'.repeat(s.confidence || 3)})`).join('\n') || '  尚無科目數據'}

🎯 弱點集群 Top 5
${Object.entries(stats.cluster_weakness || {}).sort((a,b) => b[1].wrong_count - a[1].wrong_count).slice(0,5).map(([id, d], i) => `  ${i+1}. ${d.concept || id}: ${d.wrong_count} 錯 / ${d.total_seen || '?'} 次`).join('\n') || '  尚無弱點數據'}

══════════════════════════════
  易考通 — AI 國考準備平台
  https://anycalculator.site/nursing/
══════════════════════════════`;

  document.getElementById('reportText').textContent = report;
  document.getElementById('reportModal').classList.add('show');
}

function closeReportModal() {
  document.getElementById('reportModal').classList.remove('show');
}

function copyReport() {
  const text = document.getElementById('reportText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ 報告已複製到剪貼簿！');
    closeReportModal();
  }).catch(() => {
    showToast('❌ 複製失敗，請手動選取複製');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Period tab switching
document.getElementById('periodTabs').addEventListener('click', (e) => {
  if (!e.target.classList.contains('period-tab')) return;
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentPeriod = e.target.dataset.period;
  // Re-render with period-specific data (simplified: re-renders all)
  renderAll();
  showToast(`已切換至「${e.target.textContent.trim()}」視圖`);
});

// Close modal on backdrop click
document.getElementById('reportModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('reportModal')) closeReportModal();
});
