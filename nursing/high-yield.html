let activeSubject = 'all';

function render() {
  // Stats
  const stats = DATA.meta;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${stats.total}</div><div class="label">題庫總數</div></div>
    <div class="stat"><div class="num">${stats.repeated_topics}</div><div class="label">高重複主題</div></div>
    <div class="stat"><div class="num">${stats.years.length}</div><div class="label">涵蓋年份</div></div>
  `;

  // Subject tabs
  const tabsHtml = ['<div class="subject-tab active" onclick="setSubject(\'all\')">📌 全部</div>'];
  const subjNames = Object.keys(DATA.by_subject);
  const icons = {'基礎醫學':'🫀','基本護理學':'💉','內外科護理學':'🏥','產兒科護理學':'👶','精神科與社區衛生護理學':'🧠'};
  subjNames.forEach(s => {
    const n = DATA.by_subject[s].repeated_topics;
    const icon = icons[s] || '📖';
    tabsHtml.push(`<div class="subject-tab" onclick="setSubject('${s}')">${icon} ${s.replace('護理學','').replace('與社區衛生','')} (${n})</div>`);
  });
  document.getElementById('tabs').innerHTML = tabsHtml.join('');

  renderTopics();
}

function setSubject(s) {
  activeSubject = s;
  document.querySelectorAll('.subject-tab').forEach(el => {
    const txt = el.textContent.includes('全部') ? 'all' : Object.keys(DATA.by_subject).find(k => el.textContent.includes(k.replace('護理學','').replace('與社區衛生',''))) || s;
    el.classList.toggle('active', s === (txt === 'all' ? 'all' : el.textContent.includes('全部') ? 'all' : txt));
  });
  // Fix: simpler approach
  document.querySelectorAll('.subject-tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.subject-tab')[s === 'all' ? 0 : Object.keys(DATA.by_subject).indexOf(s) + 1].classList.add('active');
  renderTopics();
}

function filter() {
  renderTopics();
}

function renderTopics() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let topics = DATA.topics;
  
  if (activeSubject !== 'all') topics = topics.filter(t => t.subject === activeSubject);
  if (q) topics = topics.filter(t => t.topic.toLowerCase().includes(q) || t.appearances.some(a => a.text.toLowerCase().includes(q)));

  if (!topics.length) {
    document.getElementById('topics').innerHTML = '<div class="empty">🔍 沒有符合的主題</div>';
    return;
  }

  let html = '';
  topics.forEach((t, i) => {
    html += `
      <div class="topic-card">
        <div class="topic-header">
          <div class="topic-title">${t.topic.substring(0, 50)}${t.topic.length > 50 ? '...' : ''}</div>
          <span class="topic-badge">${t.count}x 重複</span>
        </div>
        <div class="topic-years">出現年份：${t.years.join('、')} · ${t.subject}</div>
        <button class="toggle-btn" onclick="toggle(${i})">▶ 查看歷年題目</button>
        <div class="details" id="detail-${i}">
          ${t.appearances.sort((a,b)=>a.year-b.year).map(a => `
            <div class="q-item">
              <div class="q-year">${a.year} 年 · 第 ${a.qnum} 題</div>
              <div class="q-text">${a.text.substring(0, 200)}${a.text.length > 200 ? '...' : ''}</div>
              <div class="q-opts">${Object.entries(a.options || {}).map(([k,v]) => `<div>${k}. ${v.substring(0, 80)}</div>`).join('')}</div>
              <div class="q-answer">✅ 正確答案：${a.answer}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
  });
  document.getElementById('topics').innerHTML = html;
}

function toggle(i) {
  const el = document.getElementById('detail-' + i);
  el.classList.toggle('open');
  el.previousElementSibling.textContent = el.classList.contains('open') ? '▼ 收起' : '▶ 查看歷年題目';
}

render();
</script>
</body>
</html>
