<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="analytics.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易考通 - AI 家教</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="易考通 AI 國考家教 — 隨時問問題、問觀念、問計畫、考前策略，你的 24 小時 AI 家教。">
<style>
:root {
  --bg: #0a0e17;
  --card: #111827;
  --border: #1f2937;
  --accent: #ef4444;
  --primary: #3b82f6;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --text3: #6b7280;
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f59e0b;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Top Nav ── */
.topnav { background: #0d1321; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.topnav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; }
.topnav .logo { font-size: 1.1rem; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.topnav .logo .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
.topnav nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.topnav nav a { font-size: 0.78rem; color: var(--text2); padding: 6px 10px; border-radius: 8px; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
.topnav nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.topnav nav a.active { color: var(--primary); background: rgba(59,130,246,0.12); font-weight: 600; }
.topnav .mobile-menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; padding: 4px; }
@media (max-width: 900px) {
  .topnav nav { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #0d1321; flex-direction: column; padding: 12px; border-bottom: 1px solid var(--border); gap: 4px; }
  .topnav nav.open { display: flex; }
  .topnav nav a { padding: 10px 12px; width: 100%; }
  .topnav .mobile-menu-btn { display: block; }
}

/* ── Page Layout ── */
.page-wrap { display: flex; flex-direction: column; flex: 1; height: calc(100vh - 56px); }
.container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; display: flex; flex-direction: column; flex: 1; }

/* ── Header ── */
.page-header { padding: 20px 0 12px; }
.page-header h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.page-header .subtitle { font-size: 0.82rem; color: var(--text2); margin-top: 4px; }

/* ── Chat Area ── */
.chat-area { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: flex; flex-direction: column; gap: 12px; }

/* ── Message Bubbles ── */
.msg { display: flex; gap: 10px; max-width: 90%; animation: msgIn 0.3s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }
.msg .avatar {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.msg.user .avatar { background: var(--primary); }
.msg.ai .avatar { background: linear-gradient(135deg, #f59e0b, #d97706); }
.msg .bubble {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px;
  font-size: 0.88rem; line-height: 1.7; color: var(--text);
}
.msg.user .bubble { background: var(--primary); border-color: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai .bubble { border-bottom-left-radius: 4px; }
.msg .bubble p { margin-bottom: 6px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .msg-time { font-size: 0.68rem; color: var(--text3); margin-top: 4px; }
.msg.user .msg-time { text-align: right; }

/* ── Quick Actions on AI messages ── */
.msg-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.msg-action-btn {
  padding: 5px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: inherit;
  transition: all 0.15s;
}
.msg-action-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(59,130,246,0.08); }

/* ── Typing Indicator ── */
.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
.typing-indicator span {
  width: 8px; height: 8px; background: var(--text3); border-radius: 50%; animation: bounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

/* ── Input Area ── */
.chat-input-wrap {
  position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 20px;
  border-top: 1px solid var(--border);
}
.chat-input-inner { display: flex; gap: 8px; align-items: flex-end; }
.chat-input-inner textarea {
  flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; font-size: 0.88rem; color: var(--text); font-family: inherit;
  resize: none; min-height: 44px; max-height: 120px; line-height: 1.5;
  outline: none; transition: border-color 0.15s;
}
.chat-input-inner textarea:focus { border-color: var(--primary); }
.chat-input-inner textarea::placeholder { color: var(--text3); }
.chat-input-inner .send-btn {
  width: 44px; height: 44px; border-radius: 12px; border: none;
  background: var(--primary); color: #fff; font-size: 1.2rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.15s;
}
.chat-input-inner .send-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.chat-input-inner .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

/* ── Quick Prompts ── */
.quick-prompts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.quick-prompt-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text2); font-family: inherit;
  transition: all 0.15s; white-space: nowrap;
}
.quick-prompt-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(59,130,246,0.08); }

/* ── Welcome Screen ── */
.welcome { text-align: center; padding: 40px 20px; }
.welcome .w-icon { font-size: 3.5rem; margin-bottom: 12px; }
.welcome h2 { font-size: 1.2rem; margin-bottom: 8px; }
.welcome p { font-size: 0.85rem; color: var(--text2); margin-bottom: 4px; max-width: 500px; margin-left: auto; margin-right: auto; }
.welcome .w-topics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
@media (max-width: 480px) { .welcome .w-topics { grid-template-columns: 1fr; } }
.welcome .w-topic-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; cursor: pointer; transition: all 0.15s; text-align: center;
}
.welcome .w-topic-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.welcome .w-topic-card .wt-icon { font-size: 1.5rem; margin-bottom: 4px; }
.welcome .w-topic-card .wt-text { font-size: 0.78rem; color: var(--text2); }

/* ── Toast ── */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 10px 24px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; z-index: 999; display: none; white-space: nowrap; }
.toast.show { display: block; animation: toastIn 0.3s ease; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(16px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ── Scroll ── */
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════
   TUTOR PAGE — AI Tutor Chat
   Client-side keyword-based responses
   Reads localStorage for personalization
   ═══════════════════════════════════════════ */

let messageCount = 0;

// ── Load user context ──
function loadUserContext() {
  const ctx = { stats: null, settings: null, wrongBook: [], clusters: [] };
  try {
    const raw = localStorage.getItem('bekao_stats');
    if (raw) ctx.stats = JSON.parse(raw);
  } catch(e) {}
  try {
    const raw = localStorage.getItem('bekao_settings');
    if (raw) ctx.settings = JSON.parse(raw);
  } catch(e) {}
  try {
    const raw = localStorage.getItem('bekao_wrong_book');
    if (raw) ctx.wrongBook = JSON.parse(raw);
  } catch(e) {}
  // Also check nursingWrongBook
  try {
    const raw = localStorage.getItem('nursingWrongBook');
    if (raw) ctx.wrongBook = [...ctx.wrongBook, ...JSON.parse(raw)];
  } catch(e) {}
  return ctx;
}

// ── Generate AI response ──
function generateResponse(query, ctx) {
  const q = query.toLowerCase();
  const stats = ctx.stats || {};
  const settings = ctx.settings || {};
  const wrongBook = ctx.wrongBook || [];
  const totalQ = stats.total_answered || 0;
  const pct = totalQ > 0 ? Math.round((stats.total_correct / totalQ) * 100) : 0;
  const examName = settings.exam_name || '護理師國考';

  // Get top wrong clusters
  const clusterWeakness = stats.cluster_weakness || {};
  const topClusters = Object.entries(clusterWeakness)
    .sort((a, b) => b[1].wrong_count - a[1].wrong_count)
    .slice(0, 3)
    .map(([id, d]) => d.concept || id);

  // Keyword matching
  if (q.includes('解釋') || q.includes('這題') || q.includes('題目')) {
    const lastExp = getLastExplanation();
    if (lastExp) {
      const qText = lastExp.question ? lastExp.question.text : '';
      return `關於這題「${qText.slice(0, 60)}${qText.length > 60 ? '...' : ''}」：

這題的核心觀念是 **${lastExp.clusterInfo ? lastExp.clusterInfo.concept : '相關考點'}**。

建議你先回到「<a href="explanation.html">深度解析</a>」頁面查看完整解析，包括選項分析、記憶口訣和臨床情境。如果你想問的是特定概念而非單一題目，請告訴我是哪個概念，我可以幫你整理重點。`;
    }
    return `我目前沒有你最後作答的題目資料。請先到「<a href="quiz.html">刷題</a>」頁面完成一些題目，答題後會自動進入「<a href="explanation.html">深度解析</a>」頁面，你可以從那裡看到完整解析。

如果你想問的是某個具體的考題觀念，請告訴我科目和題目內容，我可以幫你分析。`;
  }

  if (q.includes('觀念') || q.includes('概念') || q.includes('差別') || q.includes('差別') || q.includes('什麼是') || q.includes('怎麼分')) {
    if (q.includes('行政處分') || q.includes('法規命令')) {
      return `**行政處分 vs 法規命令 — 核心區別**

📌 **一句話記住：**
「行政處分是針對**具體案件**的決定，法規命令是針對**不特定多數人**的抽象規範。」

| 比較 | 行政處分 | 法規命令 |
|------|---------|---------|
| 對象 | 具體、特定 | 抽象、一般 |
| 效力 | 個案性 | 普遍性 |
| 例子 | 核發許可證 | 訂定施行細則 |

💡 **考試技巧：** 題目看到「某甲申請…被駁回」→ 行政處分；看到「訂定…辦法」→ 法規命令。這是高頻考點，務必掌握！

需要我用題目來幫你練習嗎？`;
    }

    return `這是個好問題！「${query.slice(0, 30)}${query.length > 30 ? '...' : ''}」相關的概念重點：

📖 **建議學習路徑：**
1. 先到「<a href="quiz.html">刷題</a>」選擇對應科目，做相關題目
2. 答錯的題目會自動收錄到「<a href="review.html">錯題本</a>」
3. 使用錯題本的「概念強化」功能進行針對性練習

如果你想問的是特定科目中的具體章節，告訴我科目名稱，我可以給你更具體的建議。`;
  }

  if (q.includes('計畫') || q.includes('進度') || q.includes('排') || q.includes('今天')) {
    if (totalQ === 0) {
      return `你還沒有開始刷題喔！讓我幫你規劃一個入門方案：

📋 **今日建議計畫：**
1. 📖 先到「<a href="diagnosis.html">診斷</a>」頁面設定你的考試目標
2. 🎯 選擇一個科目，做 10-20 題了解自己的程度
3. 📊 系統會根據你的答題結果產生弱點分析
4. 🔄 針對弱點概念進行強化練習

💪 每天固定時間刷題，建立學習節奏是成功的關鍵！`;
    }

    const weakCluster = topClusters.length > 0 ? topClusters[0] : '基礎觀念';
    return `根據你的答題數據，以下是今日個人化計畫：

📋 **${examName} 今日作戰計畫**

1. 🔄 **弱點特攻（30 分鐘）**
   你的最弱概念是「${weakCluster}」，建議先做這個概念的強化練習
   → <a href="review.html">前往錯題本</a> 點擊概念強化按鈕

2. 🎯 **刷題練習（45 分鐘）**
   選擇你最弱的科目，做 20 題
   → <a href="quiz.html">開始刷題</a>

3. 📚 **錯題複習（20 分鐘）**
   複習最近 3 天的新增錯題
   → <a href="review.html">打開錯題本</a>

4. ✅ **打卡簽到**
   完成後記得打卡保持連續記錄！

${pct < 60 ? '⚠️ 你的正確率偏低，建議放慢速度，每題仔細思考後再作答。' : ''}
${pct >= 70 ? '🔥 正確率不錯！繼續保持節奏，挑戰更多題目。' : ''}`;
  }

  if (q.includes('考前') || q.includes('衝刺') || q.includes('策略') || q.includes('考試')) {
    const examDate = settings.exam_date ? new Date(settings.exam_date) : null;
    let daysLeft = '?';
    if (examDate) {
      const now = new Date(); now.setHours(0,0,0,0);
      daysLeft = Math.max(0, Math.ceil((examDate.getTime() - now.getTime()) / (1000 * 60 * 60 * 24)));
    }

    return `🎯 **${examName} 考前備戰策略**

${examDate ? `⏰ 距離考試還有 **${daysLeft} 天**\n` : '⚠️ 你還沒有設定考試日期，請到「<a href="settings.html">設定</a>」頁面設定。\n'}
📊 **你的目前狀態：** 已刷 ${totalQ} 題，正確率 ${pct}%

**衝刺期策略（考前 30 天內）：**
1. 📝 **限時模擬測驗** — 每天一次，訓練答題速度
2. 🔍 **聚焦高頻錯題** — 優先處理錯 2 次以上的題目
3. 📖 **不學新觀念** — 考前 7 天只複習不新學
4. 😴 **睡眠優先** — 考前 3 天確保充足睡眠
5. 🏃 **作息調整** — 依考試時間調整生理時鐘

**考試當天提醒：**
• 帶齊證件和准考證
• 提早 30 分鐘到場
• 每題控制在 1-2 分鐘內
• 不會的先跳過，最後再回來`;

    return msg;
  }

  if (q.includes('正確率') || q.includes('進步') || q.includes('提高') || q.includes('技巧')) {
    return `📈 **提高答題正確率的實用技巧**

你目前的正確率是 **${pct}%**，以下是具體改善方法：

1. 🔍 **分析錯因**
   每次答錯後，不要只看答案，要理解「為什麼錯」
   → 使用「<a href="explanation.html">深度解析</a>」的選項分析功能

2. 📚 **概念集群學習法**
   不要單題單題練，而是以「概念」為單位學習
   → 答錯一題後，立刻做同概念的其他題目

3. ⏱️ **放慢速度**
   研究顯示：作答速度與正確率成反比
   → 每題至少花 30 秒思考再作答

4. 🔄 **間隔複習**
   錯題不要隔天才看，當天就要複習一次
   → 利用「<a href="review.html">錯題本</a>」的排程功能

5. 📋 **建立錯題筆記**
   把常錯的概念用自己的話寫下來`;
  }

  if (q.includes('當天') || q.includes('要注意') || q.includes('準備')) {
    return `📝 **考試當天注意事項**

**出發前：**
✓ 准考證、身分證（必帶！）
✓ 2B 鉛筆、橡皮擦、黑色原子筆
✓ 手錶（非電子錶）
✓ 水、簡單零食

**到場後：**
• 提早 30-40 分鐘到考場
• 確認座位、廁所位置
• 關手機（一定要關！）

**作答策略：**
1. 先全部瀏覽一遍，把握時間分配
2. 有把握的題目先答，不確定的做記號跳過
3. 每題控制在 1-2 分鐘
4. 最後 10 分鐘檢查答案卡有無畫錯
5. 不要提早交卷！利用時間檢查

放輕鬆，你已經準備好了！💪`;
  }

  if (q.includes('弱點') || q.includes('常錯') || q.includes('錯哪些')) {
    if (topClusters.length === 0) {
      return `你還沒有足夠的答題紀錄來分析弱點。先到「<a href="quiz.html">刷題</a>」做一些題目，系統會自動追蹤你的弱點概念。`;
    }
    return `🔍 **你的弱點概念分析**

根據你的答題紀錄，最需要加強的概念：

${topClusters.map((c, i) => `${i + 1}. **${c}**`).join('\n')}

📌 **建議行動：**
→ 到「<a href="review.html">錯題本</a>」點擊這些概念的「強化練習」按鈕
→ 每個概念至少完成 5 題，直到正確率 > 70%

需要我針對某個概念做更詳細的講解嗎？`;
  }

  // Default response
  return `感謝你的提問！💡

關於「${query.slice(0, 50)}${query.length > 50 ? '...' : ''}」：

${totalQ > 0 ? `根據你目前的學習數據（已刷 ${totalQ} 題，正確率 ${pct}%），我建議你可以：\n\n` : ''}

}

function getLastExplanation() {
  try {
    const raw = sessionStorage.getItem('bekao_current_explanation');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

// ── Render functions ──
function addMessage(role, content, actions) {
  const chatArea = document.getElementById('chatArea');
  const welcomeScreen = document.getElementById('welcomeScreen');
  if (welcomeScreen) welcomeScreen.style.display = 'none';

  messageCount++;
  const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  const avatar = role === 'user' ? '🧑' : '🤖';
  const name = role === 'user' ? '你' : 'AI 家教';

  let actionsHtml = '';
  if (actions && actions.length > 0) {
    actionsHtml = '<div class="msg-actions">' + actions.map(a =>
      `<button class="msg-action-btn" onclick="${a.action}">${a.label}</button>`
    ).join('') + '</div>';
  }

  const msgHtml = `
    <div class="msg ${role}">
      <div class="avatar">${avatar}</div>
      <div>
        <div class="bubble">${content.replace(/\n/g, '<br>')}${actionsHtml}</div>
        <div class="msg-time">${name} · ${time}</div>
      </div>
    </div>`;

  chatArea.insertAdjacentHTML('beforeend', msgHtml);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addTypingIndicator() {
  const chatArea = document.getElementById('chatArea');
  const indicator = document.createElement('div');
  indicator.className = 'msg ai';
  indicator.id = 'typingIndicator';
  indicator.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chatArea.appendChild(indicator);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
  const indicator = document.getElementById('typingIndicator');
  if (indicator) indicator.remove();
}

// ── Send message ──
function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  addTypingIndicator();

  const ctx = loadUserContext();

  // Simulate AI delay
  setTimeout(() => {
    removeTypingIndicator();
    const response = generateResponse(text, ctx);

    let actions = [];
    if (text.includes('計畫') || text.includes('進度')) {
      actions = [
        { label: '📋 加到今日任務', action: 'addToPlan()' },
        { label: '📝 存為筆記', action: 'showToastMsg(\"✅ 已存為筆記（localStorage）\")' }
      ];
    }

    addMessage('ai', response, actions);
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }, 800 + Math.random() * 1200);
}

function sendQuickPrompt(prompt) {
  document.getElementById('userInput').value = prompt;
  sendMessage();
}

// ── Keyboard ──
function handleKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

// Auto-resize textarea
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Actions ──
function addToPlan() {
  let plan;
  try {
    const raw = localStorage.getItem('bekao_plan');
    plan = raw ? JSON.parse(raw) : { daily: [], weekly: [] };
  } catch(e) { plan = { daily: [], weekly: [] }; }

  plan.daily.push({
    id: Date.now().toString(),
    type: 'study',
    content: 'AI 家教建議的學習任務',
    duration: 30,
    status: 'pending',
    created: new Date().toISOString()
  });

  try {
    localStorage.setItem('bekao_plan', JSON.stringify(plan));
  } catch(e) {}

  showToastMsg('✅ 已加到今日任務！到「計畫」頁面查看');
}

function showToastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──
document.getElementById('userInput').focus();
</script>
