<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備考通 - 備考指揮中心</title>
<style>
:root {
  --bg: #0a0e17;
  --card: #111827;
  --border: #1f2937;
  --accent: #ef4444;
  --primary: #3b82f6;
  --text: #e5e7eb;
  --text-secondary: #9ca3af;
  --green: #22c55e;
  --yellow: #eab308;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Top Nav ── */
nav {
  background: #0d1321;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 100;
}
nav .logo {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  flex-shrink: 0;
  margin-right: 32px;
}
nav .logo .dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 8px var(--accent);
}
nav .links {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1;
}
nav .links a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.9rem;
  white-space: nowrap;
  transition: all 0.2s;
}
nav .links a:hover { color: var(--text); background: #1a2236; }
nav .links a.active { color: var(--accent); font-weight: 600; }

/* ── Layout ── */
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ── Countdown Banner ── */
.banner {
  background: linear-gradient(135deg, #1a1f35 0%, #111827 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.banner-left h2 { font-size: 1.1rem; color: var(--text-secondary); font-weight: 400; }
.banner-left .days { font-size: 2.8rem; font-weight: 700; color: var(--text); }
.banner-left .days span { color: var(--accent); }
.banner-center {
  text-align: center;
}
.banner-center .phase {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid;
}
.phase.foundation { color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,0.1); }
.phase.strengthen { color: #f97316; border-color: #f97316; background: rgba(249,115,22,0.1); }
.phase.sprint { color: var(--accent); border-color: var(--accent); background: rgba(239,68,68,0.1); }
.banner-right { text-align: right; }
.banner-right .completion { font-size: 1.6rem; font-weight: 700; color: var(--green); }
.banner-right .label { font-size: 0.8rem; color: var(--text-secondary); }

/* ── Stat Cards Row ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.stat-card .stat-icon { font-size: 1.5rem; margin-bottom: 8px; }
.stat-card .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text); }
.stat-card .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }

/* ── Grid ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card h3 {
  font-size: 1.05rem;
  margin-bottom: 16px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .icon { font-size: 1.2rem; }

/* ── Today's Tasks ── */
.task-list { list-style: none; }
.task-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #1a2236;
}
.task-list li:last-child { border-bottom: none; }
.task-list .task-checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-list .task-checkbox.done {
  background: var(--green);
  border-color: var(--green);
}
.task-list .task-checkbox.done::after { content: '✓'; color: #fff; font-size: 0.75rem; }
.task-list .task-info { flex: 1; }
.task-list .task-name { font-size: 0.95rem; }
.task-list .task-meta { font-size: 0.8rem; color: var(--text-secondary); }
.task-list .task-duration { font-size: 0.8rem; color: var(--primary); flex-shrink: 0; }
.btn-primary {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  margin-top: 16px;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}
.btn-primary:hover { background: #dc2626; }

/* ── Weakness Subjects ── */
.weakness-list { list-style: none; }
.weakness-list li { margin-bottom: 12px; }
.weakness-list .subject-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-size: 0.9rem;
}
.weakness-list .subject-score { font-weight: 600; font-size: 0.85rem; }
.weakness-list .bar-track {
  height: 8px;
  background: #1e293b;
  border-radius: 4px;
  overflow: hidden;
}
.weakness-list .bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s;
}
.bar-fill.red { background: var(--accent); }
.bar-fill.yellow { background: var(--yellow); }
.bar-fill.green { background: var(--green); }

/* ── AI Suggestion ── */
.ai-suggestion {
  background: linear-gradient(135deg, rgba(59,130,246,0.08) 0%, rgba(59,130,246,0.02) 100%);
  border-left: 3px solid var(--primary);
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--text-secondary);
}

/* ── Quick Entry ── */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.quick-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
}
.quick-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
.quick-btn .icon { font-size: 2rem; margin-bottom: 8px; }
.quick-btn .label { font-size: 0.85rem; color: var(--text-secondary); }

/* ── Onboarding ── */
.onboarding {
  text-align: center;
  padding: 80px 20px;
}
.onboarding h2 { font-size: 1.5rem; color: var(--text); margin-bottom: 12px; }
.onboarding p { color: var(--text-secondary); margin-bottom: 24px; }
.onboarding .btn-primary { font-size: 1rem; padding: 12px 32px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: repeat(3, 1fr); }
  nav { padding: 0 12px; }
  nav .logo { margin-right: 12px; font-size: 1.1rem; }
  nav .links a { padding: 8px 6px; font-size: 0.75rem; }
  .banner { flex-direction: column; text-align: center; }
  .banner-right { text-align: center; }
}
@media (max-width: 480px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .quick-grid { grid-template-columns: repeat(2, 1fr); }
  .banner-left .days { font-size: 2rem; }
}
</style>
</head>
<body>

<!-- Top Navigation -->
<nav>
  <a href="index.html" class="logo">備考通<span class="dot"></span></a>
  <div class="links">
    <a href="index.html" class="active">總覽</a>
    <a href="diagnosis.html">診斷</a>
    <a href="plan.html">計畫</a>
    <a href="quiz.html">刷題</a>
    <a href="explanation.html">解析</a>
    <a href="review.html">錯題</a>
    <a href="tutor.html">家教</a>
    <a href="report.html">報告</a>
    <a href="group.html">群組</a>
    <a href="settings.html">設定</a>
  </div>
</nav>

<div class="container" id="app">
  <!-- Onboarding (shown when no settings exist) -->
  <div id="onboardingSection" class="onboarding" style="display:none;">
    <h2>🎯 歡迎使用備考通</h2>
    <p>這是你專屬的備考指揮中心。先設定你的考試目標，AI 會幫你規劃最佳備考路線。</p>
    <a href="diagnosis.html" class="btn-primary">設定你的考試目標 →</a>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboardSection">

    <!-- Countdown Banner -->
    <div class="banner" id="countdownBanner">
      <div class="banner-left">
        <h2>距 離 考 試</h2>
        <div class="days"><span id="daysRemaining">--</span> 天</div>
      </div>
      <div class="banner-center">
        <span class="phase" id="phaseBadge">--</span>
      </div>
      <div class="banner-right">
        <div class="completion" id="todayCompletion">0%</div>
        <div class="label">今日完成率</div>
      </div>
    </div>

    <!-- 4 Stat Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="statAnswered">0</div>
        <div class="stat-label">刷題數</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-value" id="statAccuracy">0%</div>
        <div class="stat-label">正確率</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-value" id="statHours">0h</div>
        <div class="stat-label">學習時數</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label">連續天數</div>
      </div>
    </div>

    <!-- Quick Entry Buttons -->
    <div class="quick-grid">
      <a href="quiz.html" class="quick-btn">
        <div class="icon">🎯</div>
        <div class="label">刷題</div>
      </a>
      <a href="diagnosis.html" class="quick-btn">
        <div class="icon">🩺</div>
        <div class="label">診斷</div>
      </a>
      <a href="review.html" class="quick-btn">
        <div class="icon">📚</div>
        <div class="label">錯題</div>
      </a>
      <a href="tutor.html" class="quick-btn">
        <div class="icon">🤖</div>
        <div class="label">問AI</div>
      </a>
      <a href="report.html" class="quick-btn">
        <div class="icon">📊</div>
        <div class="label">報告</div>
      </a>
    </div>

    <!-- Two-column: Today's Tasks + Weakness -->
    <div class="grid-2">
      <!-- Today's Tasks -->
      <div class="card">
        <h3><span class="icon">📋</span>今日任務</h3>
        <ul class="task-list" id="todayTasks"></ul>
        <a href="plan.html" class="btn-primary">開始執行 →</a>
      </div>

      <!-- Weakness Subjects -->
      <div class="card">
        <h3><span class="icon">⚠️</span>弱點科目</h3>
        <ul class="weakness-list" id="weaknessList"></ul>
        <div id="weaknessEmpty" style="color:var(--text-secondary);font-size:0.9rem;">尚無答題數據，開始刷題後會顯示弱點分析。</div>
      </div>
    </div>

    <!-- AI Suggestion -->
    <div class="card" style="margin-bottom:24px;">
      <h3><span class="icon">🤖</span>AI 建議</h3>
      <div class="ai-suggestion" id="aiSuggestion">載入中…</div>
    </div>

  </div>
</div>

<script>
// ── localStorage helpers ──
function loadSettings() {
  const raw = localStorage.getItem('bekao_settings');
  return raw ? JSON.parse(raw) : null;
}
function loadStats() {
  const raw = localStorage.getItem('bekao_stats');
  return raw ? JSON.parse(raw) : { total_answered: 0, total_correct: 0, total_wrong: 0, streak_days: 0, accuracy_history: [], cluster_weakness: {} };
}
function loadPlan() {
  const raw = localStorage.getItem('bekao_plan');
  return raw ? JSON.parse(raw) : null;
}
function loadCheckin() {
  const raw = localStorage.getItem('bekao_checkin');
  return raw ? JSON.parse(raw) : { streak: 0, last_checkin_date: null, history: [] };
}

// ── Main ──
(function() {
  const settings = loadSettings();
  const stats = loadStats();
  const plan = loadPlan();
  const checkin = loadCheckin();

  // If no settings, show onboarding
  if (!settings) {
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('onboardingSection').style.display = 'block';
    return;
  }

  document.getElementById('onboardingSection').style.display = 'none';
  document.getElementById('dashboardSection').style.display = 'block';

  // ── Countdown ──
  const examDate = settings.exam_date ? new Date(settings.exam_date) : null;
  const daysRemainingEl = document.getElementById('daysRemaining');
  const phaseBadge = document.getElementById('phaseBadge');
  if (examDate) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffTime = examDate.getTime() - today.getTime();
    const diffDays = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
    daysRemainingEl.textContent = diffDays;

    let phase = '基礎期', phaseClass = 'foundation';
    if (diffDays <= 30) { phase = '衝刺期'; phaseClass = 'sprint'; }
    else if (diffDays <= 90) { phase = '強化期'; phaseClass = 'strengthen'; }
    phaseBadge.textContent = phase;
    phaseBadge.className = 'phase ' + phaseClass;
  }

  // ── Today's Completion ──
  let completionPct = 0;
  if (plan && plan.daily) {
    const done = plan.daily.filter(t => t.status === 'done').length;
    completionPct = plan.daily.length > 0 ? Math.round((done / plan.daily.length) * 100) : 0;
  }
  document.getElementById('todayCompletion').textContent = completionPct + '%';

  // ── Stat Cards ──
  document.getElementById('statAnswered').textContent = stats.total_answered || 0;
  const acc = stats.total_answered > 0 ? Math.round((stats.total_correct / stats.total_answered) * 100) : 0;
  document.getElementById('statAccuracy').textContent = acc + '%';
  const totalHours = settings.daily_hours ? (settings.daily_hours * (checkin.history ? checkin.history.length : 0)) : 0;
  document.getElementById('statHours').textContent = totalHours + 'h';
  document.getElementById('statStreak').textContent = checkin.streak || 0;

  // ── Today's Tasks ──
  const taskIcons = { 'study': '📖', 'quiz': '🎯', 'review': '🔄', 'wrong_drill': '📚', 'checkin': '✅' };
  const taskTypeNames = { 'study': '讀書', 'quiz': '刷題', 'review': '複習', 'wrong_drill': '錯題練習', 'checkin': '打卡' };
  const todayTasksEl = document.getElementById('todayTasks');
  if (plan && plan.daily && plan.daily.length > 0) {
    todayTasksEl.innerHTML = plan.daily.slice(0, 5).map((t, i) => `
      <li>
        <div class="task-checkbox ${t.status === 'done' ? 'done' : ''}" onclick="toggleTask(${i})" data-idx="${i}"></div>
        <div class="task-info">
          <div class="task-name">${taskIcons[t.type] || '📌'} ${t.content || taskTypeNames[t.type] || '任務'}</div>
          <div class="task-meta">${taskTypeNames[t.type] || t.type}</div>
        </div>
        <div class="task-duration">${t.duration || 30}m</div>
      </li>
    `).join('');
  } else {
    todayTasksEl.innerHTML = `
      <li><div class="task-checkbox"></div><div class="task-info"><div class="task-name">📖 讀書</div><div class="task-meta">基礎學習</div></div><div class="task-duration">60m</div></li>
      <li><div class="task-checkbox"></div><div class="task-info"><div class="task-name">🎯 刷題練習</div><div class="task-meta">題庫練習</div></div><div class="task-duration">45m</div></li>
      <li><div class="task-checkbox"></div><div class="task-info"><div class="task-name">🔄 複習</div><div class="task-meta">重點回顧</div></div><div class="task-duration">30m</div></li>
      <li><div class="task-checkbox"></div><div class="task-info"><div class="task-name">📚 錯題複習</div><div class="task-meta">錯題本</div></div><div class="task-duration">30m</div></li>
      <li><div class="task-checkbox"></div><div class="task-info"><div class="task-name">✅ 打卡</div><div class="task-meta">每日簽到</div></div><div class="task-duration">5m</div></li>
    `;
  }

  // ── Weakness Subjects ──
  const weaknessListEl = document.getElementById('weaknessList');
  const weaknessEmptyEl = document.getElementById('weaknessEmpty');
  const weaknesses = stats.cluster_weakness || {};
  const weakEntries = Object.entries(weaknesses).filter(([_,v]) => v.wrong_count > 0);
  if (weakEntries.length > 0) {
    weaknessEmptyEl.style.display = 'none';
    const sorted = weakEntries.sort((a,b) => {
      const aRate = b[1].wrong_count / Math.max(b[1].total_seen, 1);
      const bRate = a[1].wrong_count / Math.max(a[1].total_seen, 1);
      return aRate - bRate;
    }).slice(0, 5);
    weaknessListEl.innerHTML = sorted.map(([cid, data]) => {
      const rate = data.total_seen > 0 ? Math.round((1 - data.wrong_count / data.total_seen) * 100) : 0;
      let barClass = 'red';
      if (rate >= 70) barClass = 'green';
      else if (rate >= 50) barClass = 'yellow';
      return `
        <li>
          <div class="subject-header">
            <span>${data.concept || cid}</span>
            <span class="subject-score" style="color:${rate<50?'var(--accent)':rate<70?'var(--yellow)':'var(--green)'}">${rate}%</span>
          </div>
          <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${rate}%"></div></div>
        </li>
      `;
    }).join('');
  }

  // ── AI Suggestion ──
  const aiEl = document.getElementById('aiSuggestion');
  let aiMsg = '';
  if (acc < 50) {
    aiMsg = '⚠️ 你的整體正確率偏低，建議聚焦基礎觀念，優先複習常錯題型。每天至少安排 1 小時針對性練習。';
  } else if (acc < 70) {
    aiMsg = '📈 你的表現正在進步中！繼續維持刷題節奏，特別注意錯題本中的概念弱點。建議搭配診斷功能找出高風險科目。';
  } else {
    aiMsg = '🔥 表現優異！你的正確率相當不錯。繼續挑戰進階題型，保持每日複習節奏。考慮增加模擬考來熟悉考試壓力。';
  }
  if (checkin.streak >= 7) {
    aiMsg += ' 🏆 你已連續 ' + checkin.streak + ' 天打卡，毅力驚人！保持下去。';
  } else if (checkin.streak > 0) {
    aiMsg += ' 💪 連續 ' + checkin.streak + ' 天打卡，繼續保持！';
  } else {
    aiMsg += ' 📅 今天還沒打卡喔，記得完成今日任務並簽到！';
  }
  aiEl.textContent = aiMsg;

})();

// ── Task Toggle (inline onclick) ──
function toggleTask(idx) {
  const plan = JSON.parse(localStorage.getItem('bekao_plan') || 'null');
  if (!plan || !plan.daily || !plan.daily[idx]) return;
  plan.daily[idx].status = plan.daily[idx].status === 'done' ? 'pending' : 'done';
  localStorage.setItem('bekao_plan', JSON.stringify(plan));
  location.reload();
}
</script>

</body>
