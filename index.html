<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠 免費線上工具集 | 實用工具站</title>
<meta name="description" content="免費線上工具集，提供 QR Code 產生器、BMI 計算機等多種實用工具。無須註冊，完全免費。">
<link rel="canonical" href="https://tools-site.pages.dev/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "免費線上工具集",
  "description": "實用線上工具集合，包含 QR Code 產生器、BMI 計算機等。",
  "url": "https://tools-site.pages.dev/"
}
</script>
<style>
:root {
  --primary: #6366f1;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-light: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

header {
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
  color: #fff;
  text-align: center;
  padding: 60px 20px 48px;
}
header h1 { font-size: 2.2rem; margin-bottom: 10px; letter-spacing: -0.5px; }
header p { font-size: 1.1rem; opacity: 0.9; }

.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin: 40px 0;
}
.tool-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  padding: 28px;
  text-decoration: none;
  color: var(--text);
  transition: all .2s;
  border: 2px solid transparent;
}
.tool-card:hover {
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(99,102,241,.15);
  transform: translateY(-2px);
}
.tool-card .icon { font-size: 2.5rem; margin-bottom: 12px; }
.tool-card h2 { font-size: 1.2rem; margin-bottom: 6px; }
.tool-card p { font-size: 0.9rem; color: var(--text-light); }
.tool-card .tag {
  display: inline-block;
  background: #eef2ff;
  color: var(--primary);
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 20px;
  margin-top: 12px;
  font-weight: 600;
}

footer {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-light);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>🛠 免費線上工具集</h1>
  <p>實用線上工具，免費使用，無須註冊</p>
</header>

<main class="container">
  <div class="tool-grid">
    <a href="/qr-code-generator/" class="tool-card">
      <div class="icon">📱</div>
      <h2>QR Code 產生器</h2>
      <p>輸入文字或網址，快速生成 QR Code，支援 PNG 下載，多種尺寸與顏色可選。</p>
      <span class="tag">產生器</span>
    </a>

    <a href="/bmi-calculator/" class="tool-card">
      <div class="icon">⚖️</div>
      <h2>BMI 計算機</h2>
      <p>輸入身高體重立即計算身體質量指數，附標準對照表與健康分類。</p>
      <span class="tag">健康</span>
    </a>
  </div>

  <div style="text-align:center;padding:20px;color:var(--text-light)">
    <p>更多工具持續新增中...</p>
  </div>
</main>

<footer>
  <div class="container">
    <p><a href="/privacy-policy">隱私政策</a> · <a href="/terms">服務條款</a> · <a href="/about">關於我們</a></p>
    <p style="margin-top:8px">© 2026 工具站 — 免費線上工具集</p>
  </div>
</footer>

</body>
</html>
